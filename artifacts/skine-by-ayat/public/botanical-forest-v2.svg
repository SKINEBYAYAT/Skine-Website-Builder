<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
<defs>
 <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbf8f0"/><stop offset=".55" stop-color="#f5f1e8"/><stop offset="1" stop-color="#f8f5ed"/></linearGradient>
 <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a9b99a"/><stop offset="1" stop-color="#d3ddc7"/></linearGradient>
 <linearGradient id="sage" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dce5d4" stop-opacity=".68"/><stop offset="1" stop-color="#b9c9b1" stop-opacity=".3"/></linearGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" seed="8"/><feColorMatrix values="0 0 0 0 .55 0 0 0 0 .54 0 0 0 0 .45 0 0 0 .1 0"/></filter>
 <g id="leaf"><path d="M0 0 C-34 -25 -61 -17 -76 0 C-48 22 -20 22 0 0Z" fill="url(#leaf)" stroke="#829779" stroke-opacity=".42" stroke-width="1.4"/><path d="M-70 0Q-35 0 0 0" fill="none" stroke="#829779" stroke-opacity=".48" stroke-width="1"/></g>
 <g id="flower" fill="#fffdf5" stroke="#c9c9ad" stroke-width="1.2"><ellipse cy="-10" rx="5" ry="10"/><ellipse cx="9" cy="-3" rx="5" ry="10" transform="rotate(72 9 -3)"/><ellipse cx="6" cy="8" rx="5" ry="10" transform="rotate(144 6 8)"/><ellipse cx="-6" cy="8" rx="5" ry="10" transform="rotate(216 -6 8)"/><ellipse cx="-9" cy="-3" rx="5" ry="10" transform="rotate(288 -9 -3)"/><circle r="3.2" fill="#d8c89b" stroke="none"/></g>
</defs>
<rect width="1600" height="1000" fill="url(#paper)"/>
<!-- Large translucent sage circles framing the page; center remains open -->
<g fill="url(#sage)" filter="url(#soft)">
 <circle cx="-48" cy="365" r="310"/><circle cx="85" cy="690" r="255"/><circle cx="1640" cy="275" r="335"/><circle cx="1545" cy="730" r="295"/><circle cx="1320" cy="-95" r="215"/>
</g>
<g fill="none" stroke="#bdcbb2" stroke-width="3" opacity=".3"><circle cx="-48" cy="365" r="310"/><circle cx="1640" cy="275" r="335"/><circle cx="1545" cy="730" r="295"/></g>
<!-- Floating leaves: individually placed, with no stems or connecting branches -->
<g>
 <use href="#leaf" transform="translate(120 115) rotate(205) scale(1.05)"/><use href="#leaf" transform="translate(205 175) rotate(18) scale(.92)"/>
 <use href="#leaf" transform="translate(285 235) rotate(210) scale(1.05)"/><use href="#leaf" transform="translate(385 270) rotate(18) scale(.9)"/>
 <use href="#leaf" transform="translate(1500 105) rotate(-25) scale(1.02)"/><use href="#leaf" transform="translate(1415 165) rotate(200) scale(.92)"/>
 <use href="#leaf" transform="translate(1325 225) rotate(-25) scale(1.02)"/><use href="#leaf" transform="translate(1225 260) rotate(200) scale(.9)"/>
 <use href="#leaf" transform="translate(90 515) rotate(205) scale(.95)"/><use href="#leaf" transform="translate(155 615) rotate(18) scale(.9)"/>
 <use href="#leaf" transform="translate(105 760) rotate(205) scale(1.02)"/><use href="#leaf" transform="translate(190 835) rotate(18) scale(.9)"/>
 <use href="#leaf" transform="translate(1510 520) rotate(-25) scale(.95)"/><use href="#leaf" transform="translate(1445 620) rotate(200) scale(.9)"/>
 <use href="#leaf" transform="translate(1490 770) rotate(-25) scale(1.02)"/><use href="#leaf" transform="translate(1410 845) rotate(200) scale(.9)"/>
 <use href="#leaf" transform="translate(55 955) rotate(205) scale(.9)"/><use href="#leaf" transform="translate(1540 955) rotate(-25) scale(.9)"/>
</g>
<!-- A few larger, clearly visible leaves tucked along the outer circles -->
<g>
 <use href="#leaf" transform="translate(18 440) rotate(180) scale(1.9)" opacity=".72"/>
 <use href="#leaf" transform="translate(1582 455) rotate(0) scale(1.9)" opacity=".72"/>
 <use href="#leaf" transform="translate(22 825) rotate(180) scale(1.7)" opacity=".62"/>
 <use href="#leaf" transform="translate(1578 835) rotate(0) scale(1.7)" opacity=".62"/>
</g>
<!-- A few small white blossoms, kept away from the content area -->
<g><use href="#flower" transform="translate(55 390) scale(.95)"/><use href="#flower" transform="translate(125 700) scale(.75)"/><use href="#flower" transform="translate(1540 390) scale(.85)"/><use href="#flower" transform="translate(1485 700) scale(.72)"/></g>
<rect width="1600" height="1000" filter="url(#grain)" opacity=".15"/>
</svg>