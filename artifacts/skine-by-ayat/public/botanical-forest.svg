<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
<defs>
 <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbf8f0"/><stop offset=".55" stop-color="#f5f1e8"/><stop offset="1" stop-color="#f8f5ed"/></linearGradient>
 <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a9b99a"/><stop offset="1" stop-color="#d3ddc7"/></linearGradient>
 <linearGradient id="sage" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dce5d4" stop-opacity=".62"/><stop offset="1" stop-color="#b9c9b1" stop-opacity=".26"/></linearGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="1.8"/></filter>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" seed="8"/><feColorMatrix values="0 0 0 0 .55 0 0 0 0 .54 0 0 0 0 .45 0 0 0 .11 0"/></filter>
 <g id="leaf-shape"><path d="M0 0 C-34 -25 -61 -17 -76 0 C-48 22 -20 22 0 0Z" fill="url(#leaf)" stroke="#829779" stroke-opacity=".42" stroke-width="1.4"/><path d="M-70 0 Q-35 0 0 0" fill="none" stroke="#829779" stroke-opacity=".48" stroke-width="1"/></g>
 <g id="blossom" fill="#fffdf5" stroke="#c9c9ad" stroke-width="1.2"><ellipse cx="0" cy="-10" rx="5" ry="10"/><ellipse cx="9" cy="-3" rx="5" ry="10" transform="rotate(72 9 -3)"/><ellipse cx="6" cy="8" rx="5" ry="10" transform="rotate(144 6 8)"/><ellipse cx="-6" cy="8" rx="5" ry="10" transform="rotate(216 -6 8)"/><ellipse cx="-9" cy="-3" rx="5" ry="10" transform="rotate(288 -9 -3)"/><circle r="3.2" fill="#d8c89b" stroke="none"/></g>
</defs>
<rect width="1600" height="1000" fill="url(#paper)"/>
<!-- Large, soft overlapping botanical circles kept toward the outer edges -->
<g fill="url(#sage)" filter="url(#soft)">
